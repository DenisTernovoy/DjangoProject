{% extends 'blog/blog_common.html' %}

{% block content %}
<div class="col-12 m-3 d-flex flex-column align-items-center justify-content-center">
    <p>Вы действительно хотите удалить публикацию?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Подтвердить</button>
        <a class="btn btn-secondary" href="{% url 'blog:blog_detail' object.pk  %}">Отменить</a>
    </form>
</div>
{% endblock %}
