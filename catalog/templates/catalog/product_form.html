{% extends 'base_catalog.html' %}

{% block title %}Добавление товара{% endblock %}
{% block content %}

<div class="container">
    <form method="post" class="col-4" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            {% if change == True %}Изменить
            {% else %}Добавить
            {% endif %}
        </button>
    </form>
</div>
{% endblock %}
