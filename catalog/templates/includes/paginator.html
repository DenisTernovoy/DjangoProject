<div>
  <span>
    {% if page_obj.has_previous %}
      <a class="btn btn-secondary" href="?page={{ page_obj.previous_page_number }}">Назад</a>
    {% endif %}
    <span>
      Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}
    </span>
    {% if page_obj.has_next %}
      <a class="btn btn-secondary" href="?page={{ page_obj.next_page_number }}">Вперед</a>
    {% endif %}
  </span>
</div>
