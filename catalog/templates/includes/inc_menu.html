<header class="p-3 mb-3 border-bottom">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 link-body-emphasis text-decoration-none">
                <h5 class="my-0 mr-md-auto font-weight-normal">E-Shop</h5>
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="/" class="nav-link px-2 link-body-emphasis">Каталог</a></li>
                    <li><a href="{% url 'catalog:contacts_view' %}"
                           class="nav-link px-2 link-body-emphasis">Контакты</a>
                    </li>
                    <li><a href="{% url 'catalog:product_create' %}" class="nav-link px-2 link-body-emphasis">Добавить
                        продукт</a></li>
                    <li><a href="{% url 'blog:blog_list' %}" class="nav-link px-2 link-body-emphasis">Блог</a></li>
                </ul>
                <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search"><input type="search"
                                                                                           class="form-control"
                                                                                           placeholder="Поиск..."
                                                                                           aria-label="Search"></form>
                <div class="dropdown text-end">
                    <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="" alt="Тут должен быть аватар" width="32" height="32" class="rounded-circle"></a>
                    <ul class="dropdown-menu text-small">
                        {% if not user.is_authenticated %}
                        <li><a class="dropdown-item" href="{% url 'users:login' %}">Войти</a></li>
                        <li><a class="dropdown-item" href="{% url 'users:register' %}">Регистрация</a></li>
                        {% else %}
                        <li><a class="dropdown-item" href="{% url 'users:update' user.pk%}">Изменить профиль</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form action="{% url 'users:logout' %}" method="post">
                                {% csrf_token %}
                                <button class="dropdown-item" type="submit">Выйти</button>
                            </form>
                        </li>
                        {% endif %}
                    </ul>
                </div>
        </div>
    </div>
</header>
